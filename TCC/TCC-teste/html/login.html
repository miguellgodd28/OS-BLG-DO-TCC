<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login.css">
    <title>iCoffe - Login</title>

</head>

<body>
    <header>
        <a href="../HTML/home.html" class="logo">iCoffe</a>
        <nav class="navbar">
            <a href="../HTML/home.html">Página Inicial</a>
            <a href="../HTML/store.html">Loja</a>
            <a href="../PHP/register.php">Conta</a>
        </nav>
    </header>

    <div class="credentials">
        <form action="processa_login.php" method="POST">
            <h1>ENTRAR</h1>

            <div class="input-box">
                <input type="email" name="email" placeholder="E-mail" required>
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="senha" placeholder="Senha" required>
                <i class='bx bxs-show' id="togglePassword"></i>
            </div>

            <div class="remember-me">
                <a href="../PHP/esqueceusenha.php">Esqueceu a senha?</a>
            </div>

            <input type="submit" class="btn-login" name="submit" value="ENTRAR">

            <div class="register-link">
                <p>Ainda não tem conta? <a href="../PHP/register.php">CADASTRAR</a></p>
            </div>
        </form>
    </div>

    <script>
        // Mostrar/ocultar senha
        const togglePassword = document.querySelector("#togglePassword");
        const password = document.querySelector("#password");

        togglePassword.addEventListener("click", function () {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            this.classList.toggle("bxs-show");
            this.classList.toggle("bxs-hide");
        });
    </script>
</body>

</html>
